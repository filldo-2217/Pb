<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>학교 설문조사</title>

    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e1f22">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="학교 설문조사">
    <link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>

<div class="app">

    <!-- 왼쪽 네비게이션 (서버 아이콘 + 채널 목록) -->
    <div class="nav-wrap" id="navWrap">

        <aside class="rail">
            <button class="rail-btn home" title="홈" onclick="location.reload()">GH</button>
            <div class="rail-sep"></div>
            <button class="rail-btn add" id="railAdd" title="설문 만들기">+</button>
        </aside>

        <aside class="sidebar">
            <div class="sidebar-header">학교 설문조사</div>

            <div class="channels">
                <div class="category">설문</div>
                <button class="channel active" data-view="all">
                    <span class="hash">#</span><span class="name">전체-설문</span>
                    <span class="badge" data-badge="all"></span>
                </button>
                <button class="channel" data-view="1">
                    <span class="hash">#</span><span class="name">1학년</span>
                    <span class="badge" data-badge="1"></span>
                </button>
                <button class="channel" data-view="2">
                    <span class="hash">#</span><span class="name">2학년</span>
                    <span class="badge" data-badge="2"></span>
                </button>
                <button class="channel" data-view="3">
                    <span class="hash">#</span><span class="name">3학년</span>
                    <span class="badge" data-badge="3"></span>
                </button>

                <div class="category">내 공간</div>
                <button class="channel" data-view="mine">
                    <span class="hash">#</span><span class="name">내가-만든-설문</span>
                    <span class="badge" data-badge="mine"></span>
                </button>
                <button class="channel" data-view="guide">
                    <span class="hash">#</span><span class="name">이용-안내</span>
                </button>
            </div>

            <button class="user-panel" id="userPanel" title="내 정보 수정">
                <div class="avatar sm" id="userAvatar">?</div>
                <div class="user-text">
                    <strong id="userName">신원 미설정</strong>
                    <span id="userSub">클릭해서 입력하기</span>
                </div>
            </button>
        </aside>
    </div>

    <div class="overlay" id="navOverlay"></div>

    <!-- 메인 -->
    <main class="main">
        <header class="topbar">
            <button class="menu-btn" id="menuBtn" aria-label="메뉴">☰</button>
            <span class="hash big">#</span>
            <h1 id="channelTitle">전체-설문</h1>
            <span class="divider-v"></span>
            <span class="topic" id="channelTopic">현재 올라온 모든 설문</span>

            <div class="top-actions">
                <button class="btn btn-green" id="openCreate">+ 설문 만들기</button>
                <input id="searchInput" class="search" type="text" placeholder="검색" autocomplete="off">
            </div>
        </header>

        <div class="feed" id="feed"></div>
    </main>
</div>

<!-- 내 정보 모달 -->
<div class="modal hidden" id="profileModal">
    <div class="modal-backdrop" data-close></div>
    <div class="modal-box small">
        <div class="modal-head">
            <div>
                <h2>내 정보</h2>
                <p class="muted">설문에 참여할 때 이 정보가 함께 제출돼요.</p>
            </div>
            <button class="x" data-close>×</button>
        </div>
        <form id="profileForm" class="modal-body">
            <div id="profileFields"></div>
            <div class="form-error hidden" id="profileError"></div>
            <button type="submit" class="btn btn-primary wide">저장</button>
        </form>
    </div>
</div>

<!-- 설문 만들기 모달 -->
<div class="modal hidden" id="createModal">
    <div class="modal-backdrop" data-close></div>
    <div class="modal-box">
        <div class="modal-head">
            <div>
                <h2>설문 만들기</h2>
                <p class="muted">장난이 아닌, 진짜로 사용할 설문만 올려주세요.</p>
            </div>
            <button class="x" data-close>×</button>
        </div>

        <form id="createForm" class="modal-body">
            <label class="field">
                <span>설문 제목</span>
                <input id="cTitle" type="text" maxlength="100" placeholder="예: 2학기 학교생활 만족도 조사">
            </label>

            <label class="field">
                <span>설명</span>
                <textarea id="cDesc" maxlength="300" rows="3" placeholder="설문에 대한 간단한 설명"></textarea>
            </label>

            <div class="field">
                <span>대상 학년</span>
                <div class="chips">
                    <label class="chip"><input type="checkbox" name="cGrade" value="1"><b>1학년</b></label>
                    <label class="chip"><input type="checkbox" name="cGrade" value="2"><b>2학년</b></label>
                    <label class="chip"><input type="checkbox" name="cGrade" value="3"><b>3학년</b></label>
                </div>
            </div>

            <label class="field">
                <span>마감일</span>
                <input id="cDeadline" type="date">
            </label>

            <div class="field">
                <span>질문</span>
                <div id="qList"></div>
                <button type="button" class="btn btn-secondary wide" id="addQ">+ 질문 추가</button>
            </div>

            <div class="form-error hidden" id="createError"></div>
            <button type="submit" class="btn btn-primary wide" id="createSubmit">설문 등록하기</button>
        </form>
    </div>
</div>

<!-- 설문 참여 모달 -->
<div class="modal hidden" id="answerModal">
    <div class="modal-backdrop" data-close></div>
    <div class="modal-box">
        <div class="modal-head">
            <div>
                <h2 id="answerTitle"></h2>
                <p class="muted" id="answerDesc"></p>
            </div>
            <button class="x" data-close>×</button>
        </div>
        <div class="modal-body" id="answerBody"></div>
    </div>
</div>

<!-- 결과 모달 -->
<div class="modal hidden" id="resultModal">
    <div class="modal-backdrop" data-close></div>
    <div class="modal-box wide-box">
        <div class="modal-head">
            <div>
                <h2 id="resultTitle"></h2>
                <p class="muted" id="resultSub"></p>
            </div>
            <button class="x" data-close>×</button>
        </div>
        <div class="modal-body" id="resultBody"></div>
    </div>
</div>

<div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js"></script>
</body>
</html>
