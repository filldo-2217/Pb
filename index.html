<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>학교 설문조사</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e1f22">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="학교 설문조사">
  <link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
<div class="app">
  <header class="chan-head">
    <div class="chan-left">
      <span class="hash">#</span><b>설문조사</b>
      <span class="divider"></span>
      <span class="topic">참여할 수 있는 설문 <b id="surveyCount">0</b>개</span>
    </div>
    <div class="chan-right">
      <div class="search"><input id="searchInput" placeholder="검색" autocomplete="off"><span>🔍</span></div>
      <button id="profileBtn" class="chip">👤 정보 입력</button>
      <button id="teacherBtn" class="chip">🔑 교사</button>
    </div>
  </header>

    <div class="filters">
      <button class="filter-btn active" data-grade="all">전체</button>
      <button class="filter-btn" data-grade="1">1학년</button>
      <button class="filter-btn" data-grade="2">2학년</button>
      <button class="filter-btn" data-grade="3">3학년</button>
      <button class="filter-btn teacher-tab" data-grade="teacher">👨‍🏫 선생님</button>
    </div>


  <main class="feed" id="feed">
    <div class="welcome">
      <div class="welcome-icon">#</div>
      <h1>#설문조사 에 오신 것을 환영합니다!</h1>
      <p>학교 설문조사 채널의 시작이에요. 장난 설문은 금지! 실제로 사용할 설문만 올려주세요.</p>
    </div>
    <div id="teacherBanner" class="banner hidden">🛡️ 교사 모드 · 모든 설문의 결과 확인과 삭제가 가능합니다</div>
    <div id="surveyList"></div>
    <div id="emptyState" class="empty hidden">설문이 없습니다. 다른 검색어나 학년을 선택해보세요.</div>
  </main>

  <footer class="composer">
    <button id="openAdd" class="composer-box"><span class="plus">＋</span><span>새 설문 만들기...</span></button>
  </footer>
</div>

<div id="modal" class="modal hidden">
  <div class="modal-backdrop" id="modalBackdrop"></div>
  <div class="modal-box" id="modalBox"></div>
</div>
<div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js"></script>
</body>
</html>
